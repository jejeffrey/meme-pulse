name: Meme Pulse 자동 수집

# ── 왜 이렇게 바꿨나 ─────────────────────────────────────────────
# 예전: 30분마다 예약했지만 실제 실행 간격은 중앙값 약 3시간(최대 7시간 이상)이었다.
#   GitHub 예약 실행은 정각·30분처럼 붐비는 시각에 자주 늦거나 건너뛴다.
#   서울 도시데이터는 지난 값을 다시 받을 수 없어서 빠진 시간은 영영 비게 된다.
# 이제:
#   ① 붐비지 않는 분(4·24·44분)에 예약하고
#   ② 바깥 예약 서비스(cron-job.org, 무료)가 10분마다 이 워크플로를 깨우면 한 번만 수집하고 끝낸다
#      (하루 실행 시간이 가장 적고, 가장 정시에 가깝다 — 권장)
#   ③ GitHub 자체 예약은 예비용: 실행되면 25분 동안 10분 칸마다 반복해 빈틈을 줄인다
#   ④ 새 자료가 없으면 사이트를 다시 게시하지 않는다 (Pages 빌드·전송량 절약)
# 수집기 안에서는 자료원마다 시간표(config.json › schedule)를 따로 지키므로,
# 자주 깨워도 에어코리아는 한 시간에 한 번, 스캔은 세 시간에 한 번만 부른다.
on:
  schedule:
    - cron: "4,24,44 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "이번 실행에서 반복할 시간(분). 0이면 한 번만 수집 (바깥 예약 서비스가 10분마다 깨울 때)"
        required: false
        default: "0"
  repository_dispatch:
    types: [collect]

permissions:
  contents: write

concurrency:
  group: meme-pulse-collect
  cancel-in-progress: false     # 실행 중이면 새 실행은 하나만 대기했다가 이어받음 → 빈틈 없이 교대

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      # 바깥 예약(10분마다)으로 깨우면 한 번만 수집하고 끝 → 하루 실행 시간 최소.
      # GitHub 자체 예약(늦거나 빠지기 쉬움)은 예비용이라 25분 동안 반복해 빈틈을 줄인다.
      LOOP_MINUTES: ${{ github.event_name == 'schedule' && '25' || github.event.inputs.minutes || '0' }}
      INTERVAL_SEC: "600"
    steps:
      - uses: actions/checkout@v4

      - name: 이전 수집 자료 가져오기
        run: |
          mkdir -p data
          if git fetch origin gh-pages --depth=1 2>/dev/null; then
            git show origin/gh-pages:data/history.json > data/history.json 2>/dev/null || rm -f data/history.json
            git show origin/gh-pages:data/scan.json > data/scan.json 2>/dev/null || rm -f data/scan.json
          else
            echo "첫 실행: 이전 자료 없음"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집 · 게시 반복 (10분 칸마다)
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          AIRKOREA_API_KEY: ${{ secrets.AIRKOREA_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          publish() {
            rm -rf site && mkdir -p site/data
            cp index.html guide.html site/
            cp data/history.json data/data.js site/data/
            [ -f data/scan.json ] && cp data/scan.json site/data/ || true
            touch site/.nojekyll
            (
              cd site
              git init -q -b gh-pages
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  add -A
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -qm "자료 갱신 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
              git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
            ) && echo "게시 완료" || echo "게시 실패 (다음 칸에 다시 시도)"
          }
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          while :; do
            python collector/collect.py || echo "수집기 오류 (다음 칸에 다시 시도)"
            if [ "$(cat data/.changed 2>/dev/null)" = "0" ]; then
              echo "새 자료 없음 → 게시 생략"
            else
              publish
            fi
            now=$(date +%s)
            wake=$(( (now / INTERVAL_SEC + 1) * INTERVAL_SEC + 60 ))   # 다음 10분 칸 + 1분
            if [ $wake -ge $end ]; then echo "반복 시간 끝"; break; fi
            echo "다음 수집: $(TZ=Asia/Seoul date -d @$wake '+%H:%M')"
            sleep $(( wake - now ))
          done
